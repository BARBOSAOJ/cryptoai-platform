quarkus.http.port=8081

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,OPTIONS,PUT,DELETE
quarkus.http.cors.headers=Content-Type,Authorization,Cache-Control

binance.api.url=https://api.binance.com
quarkus.swagger-ui.always-include=true

# ─── Dev: arranque rápido ─────────────────────────────────────────────────────
%dev.quarkus.devservices.enabled=false
%dev.quarkus.analytics.disabled=true
%dev.quarkus.test.continuous-testing=disabled

# Base de datos
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:admin}
quarkus.datasource.password=${DB_PASSWORD:adminpassword}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crypto_platform}
quarkus.hibernate-orm.schema-management.strategy=update

# Redis
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
quarkus.redis.timeout=2S

# RabbitMQ
rabbitmq-host=localhost
rabbitmq-port=5672
rabbitmq-username=${RABBITMQ_USER:admin}
rabbitmq-password=${RABBITMQ_PASSWORD:adminpassword}
mp.messaging.outgoing.orders.connector=smallrye-rabbitmq
mp.messaging.outgoing.orders.exchange.name=orders
mp.messaging.outgoing.orders.routing-key=order.new
mp.messaging.outgoing.orders.exchange.durable=true
mp.messaging.outgoing.orders.exchange.type=direct
mp.messaging.outgoing.orders.exchange.declare=true

# Comunicación interna con user-service
quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://localhost:8080}

# JWT verificacion (misma clave publica que user-service)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://crypto-ai-platform.com
quarkus.native.resources.includes=publicKey.pem

# ─── Perfil de test (H2 en memoria, sin RabbitMQ ni Redis reales) ─────────────
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.redis.hosts=redis://localhost:6379
%test.quarkus.redis.timeout=1S
%test.mp.messaging.outgoing.orders.connector=smallrye-in-memory
%test.mp.messaging.outgoing.orders.merge=true
